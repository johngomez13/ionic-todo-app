<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tareas</ion-title>
    <ion-note slot="end" class="ion-padding-end">{{ pendingLabel() }}</ion-note>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form (ngSubmit)="addTask()">
    <ion-item>
      <ion-input
        name="title"
        label="Nueva tarea"
        labelPlacement="stacked"
        placeholder="¿Qué hay que hacer?"
        autocomplete="off"
        [ngModel]="draft()"
        (ngModelChange)="onDraftChange($event)"
      />
      <ion-button slot="end" type="submit" [disabled]="!canAddTask()">Agregar</ion-button>
    </ion-item>
  </form>

  <ion-segment [value]="statusFilter()" (ionChange)="onFilterChange($event)">
    <ion-segment-button value="all">
      <ion-label>Todas</ion-label>
    </ion-segment-button>
    <ion-segment-button value="pending">
      <ion-label>Pendientes</ion-label>
    </ion-segment-button>
    <ion-segment-button value="completed">
      <ion-label>Completadas</ion-label>
    </ion-segment-button>
  </ion-segment>

  @if (emptyMessage(); as message) {
  <p class="ion-padding ion-text-center">{{ message }}</p>
  } @else {
  <ion-list>
    @for (task of visibleTasks(); track task.id) {
    <ion-item>
      <ion-checkbox justify="start" labelPlacement="end" [checked]="task.completed" (ionChange)="toggleTask(task.id)">
        {{ task.title }}
      </ion-checkbox>
      <ion-button
        slot="end"
        fill="clear"
        color="medium"
        [attr.aria-label]="task.removeLabel"
        (click)="removeTask(task.id)"
      >
        <ion-icon slot="icon-only" name="trash-outline" />
      </ion-button>
    </ion-item>
    }
  </ion-list>
  }
</ion-content>
