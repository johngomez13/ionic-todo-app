<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Tareas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form (ngSubmit)="addTask()">
    <ion-item>
      <ion-input
        name="title"
        label="Nueva tarea"
        labelPlacement="stacked"
        placeholder="¿Qué hay que hacer?"
        autocomplete="off"
        [(ngModel)]="draft"
      />
      <ion-button slot="end" type="submit" [disabled]="draft.trim().length === 0">Agregar</ion-button>
    </ion-item>
  </form>

  @if (tasks().length === 0) {
  <p class="ion-padding ion-text-center">No hay tareas todavía.</p>
  } @else {
  <ion-list>
    @for (task of tasks(); track task.id) {
    <ion-item>
      <ion-checkbox justify="start" labelPlacement="end" [checked]="task.completed" (ionChange)="toggleTask(task.id)">
        {{ task.title }}
      </ion-checkbox>
      <ion-button
        slot="end"
        fill="clear"
        color="medium"
        [attr.aria-label]="'Eliminar ' + task.title"
        (click)="removeTask(task.id)"
      >
        <ion-icon slot="icon-only" name="trash-outline" />
      </ion-button>
    </ion-item>
    }
  </ion-list>
  }
</ion-content>
